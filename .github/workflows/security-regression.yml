name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to run the suite against"
        required: false
        default: ""


concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  security-surface:
    name: SQL security surface + Vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}


      - name: Cache apt packages (postgresql-client)
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-postgresql-client-${{ runner.os }}-v1

      - name: Install psql client
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d ~/.cache/apt-archives ] && [ -n "$(ls -A ~/.cache/apt-archives 2>/dev/null)" ]; then
            sudo cp -n ~/.cache/apt-archives/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          mkdir -p ~/.cache/apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
          sudo chown -R "$USER" ~/.cache/apt-archives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Vite build outputs
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: vite-${{ runner.os }}-${{ hashFiles('vite.config.ts', 'bun.lockb', 'bun.lock') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Cache Vitest .cache directory
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest
            .vitest-cache
          key: vitest-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('vitest.config.*', 'vite.config.ts', 'bun.lockb', 'bun.lock') }}-${{ hashFiles('src/lib/security-surface.test.ts', 'supabase/tests/security_surface.sql') }}
          restore-keys: |
            vitest-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('vitest.config.*', 'vite.config.ts', 'bun.lockb', 'bun.lock') }}-
            vitest-${{ runner.os }}-node${{ matrix.node }}-


      - name: Compute migrations cache key
        id: migkey
        run: |
          hash=$(cat supabase/migrations/*.sql | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache applied-migration schema dump
        id: schema-cache
        uses: actions/cache@v4
        with:
          path: .cache/schema.dump
          key: pgdump-${{ runner.os }}-pg15-${{ steps.migkey.outputs.hash }}

      - name: Prepare Supabase-compatible roles
        # Migrations reference the standard Supabase roles (anon,
        # authenticated, service_role) and the auth schema. Create minimal
        # stand-ins so the schema applies cleanly against vanilla Postgres.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb,
            email_confirmed_at timestamptz
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT 'authenticated'::text $$;
          SQL

      - name: Restore schema from cache
        if: steps.schema-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p artifacts
          echo "restoring cached schema dump" | tee artifacts/migrations.log
          psql -v ON_ERROR_STOP=1 -f .cache/schema.dump >> artifacts/migrations.log 2>&1

      - name: Apply Supabase migrations
        if: steps.schema-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p artifacts .cache
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--> applying $f" | tee -a artifacts/migrations.log
            psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a artifacts/migrations.log
          done
          # Snapshot the resulting schema + data so subsequent runs with the
          # same migration set can skip the per-file apply loop.
          pg_dump --format=plain --no-owner --no-privileges \
            --schema=public --schema=auth \
            > .cache/schema.dump


      - name: Run security-surface regression suite (Node ${{ matrix.node }})
        id: vitest
        run: |
          mkdir -p artifacts
          node --version | tee artifacts/node-version.txt
          set -o pipefail
          npx --no-install vitest run src/lib/security-surface.test.ts \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=artifacts/junit.xml \
            2>&1 | tee artifacts/vitest.log

      - name: Build HTML test report
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f artifacts/junit.xml ]; then
            node scripts/junit-to-html.mjs artifacts/junit.xml artifacts/report.html
          else
            echo "<h1>No JUnit XML produced</h1>" > artifacts/report.html
          fi

      - name: Write job summary (Node ${{ matrix.node }})
        if: always()
        run: node scripts/junit-to-summary.mjs artifacts/junit.xml "Node ${{ matrix.node }}"


      - name: Collect Postgres logs
        if: failure()
        run: |
          mkdir -p artifacts
          # The postgres service runs as a docker container on the runner.
          container=$(docker ps --filter "ancestor=postgres:15" --format '{{.ID}}' | head -n1)
          if [ -n "$container" ]; then
            docker logs "$container" > artifacts/postgres.log 2>&1 || true
            docker inspect "$container" > artifacts/postgres-inspect.json 2>&1 || true
          else
            echo "no postgres container found" > artifacts/postgres.log
          fi

      - name: Bundle test outputs into single zip
        if: always()
        id: bundle
        run: |
          mkdir -p artifacts
          bundle_name="security-regression-node${{ matrix.node }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}.zip"
          bundle_path="artifacts/${bundle_name}"
          staging="$(mktemp -d)"
          for f in junit.xml report.html vitest.log node-version.txt migrations.log postgres.log postgres-inspect.json; do
            [ -f "artifacts/$f" ] && cp "artifacts/$f" "$staging/" || true
          done
          ( cd "$staging" && zip -qr "$GITHUB_WORKSPACE/$bundle_path" . )
          echo "bundle_name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "bundle_path=$bundle_path" >> "$GITHUB_OUTPUT"
          ls -la "$bundle_path"

      - name: Upload bundled test artifacts
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.bundle_path }}
          if-no-files-found: warn
          retention-days: 14




      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-logs-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/migrations.log
            artifacts/postgres.log
            artifacts/postgres-inspect.json
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          artifacts_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          report_url="${{ steps.upload-report.outputs.artifact-url }}"
          report_url="${report_url:-$artifacts_url}"
          payload=$(cat <<JSON
          {
            "text": ":rotating_light: Security regression failed on \`${GITHUB_REF_NAME}\` (${GITHUB_REPOSITORY}) — Node ${{ matrix.node }}",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "Security regression failed" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Repo:*\n${GITHUB_REPOSITORY}" },
                  { "type": "mrkdwn", "text": "*Ref:*\n\`${GITHUB_REF_NAME}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${GITHUB_SHA:0:7}\`" },
                  { "type": "mrkdwn", "text": "*Node:*\n${{ matrix.node }}" },
                  { "type": "mrkdwn", "text": "*Event:*\n${GITHUB_EVENT_NAME}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  { "type": "button", "text": { "type": "plain_text", "text": "View run" }, "url": "${run_url}" },
                  { "type": "button", "text": { "type": "plain_text", "text": "JUnit report (Node ${{ matrix.node }})" }, "url": "${report_url}" },
                  { "type": "button", "text": { "type": "plain_text", "text": "All artifacts" }, "url": "${artifacts_url}" }
                ]
              }
            ]
          }
          JSON
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"



