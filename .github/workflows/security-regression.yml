name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to run the suite against"
        required: false
        default: ""
      max_log_bytes:
        description: "Per-log cap in bytes before truncation (default 2097152 = 2 MiB). Also settable via repo var SECURITY_REGRESSION_MAX_LOG_BYTES."
        required: false
        default: ""
      head_bytes:
        description: "Bytes kept from the top of a truncated log (default 524288 = 512 KiB). Also settable via repo var SECURITY_REGRESSION_HEAD_BYTES."
        required: false
        default: ""
      tail_bytes:
        description: "Bytes kept from the bottom of a truncated log (default 1572864 = 1.5 MiB). Also settable via repo var SECURITY_REGRESSION_TAIL_BYTES."
        required: false
        default: ""



concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  security-surface:
    name: SQL security surface + Vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}


      - name: Cache apt packages (postgresql-client)
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-postgresql-client-${{ runner.os }}-v1

      - name: Install psql client
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d ~/.cache/apt-archives ] && [ -n "$(ls -A ~/.cache/apt-archives 2>/dev/null)" ]; then
            sudo cp -n ~/.cache/apt-archives/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          mkdir -p ~/.cache/apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
          sudo chown -R "$USER" ~/.cache/apt-archives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Vite build outputs
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: vite-${{ runner.os }}-${{ hashFiles('vite.config.ts', 'bun.lockb', 'bun.lock') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Cache Vitest .cache directory
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest
            .vitest-cache
          key: vitest-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('vitest.config.*', 'vite.config.ts', 'bun.lockb', 'bun.lock') }}-${{ hashFiles('src/lib/security-surface.test.ts', 'supabase/tests/security_surface.sql') }}
          restore-keys: |
            vitest-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('vitest.config.*', 'vite.config.ts', 'bun.lockb', 'bun.lock') }}-
            vitest-${{ runner.os }}-node${{ matrix.node }}-


      - name: Compute migrations cache key
        id: migkey
        run: |
          hash=$(cat supabase/migrations/*.sql | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache applied-migration schema dump
        id: schema-cache
        uses: actions/cache@v4
        with:
          path: .cache/schema.dump
          key: pgdump-${{ runner.os }}-pg15-${{ steps.migkey.outputs.hash }}

      - name: Prepare Supabase-compatible roles
        # Migrations reference the standard Supabase roles (anon,
        # authenticated, service_role) and the auth schema. Create minimal
        # stand-ins so the schema applies cleanly against vanilla Postgres.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb,
            email_confirmed_at timestamptz
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT 'authenticated'::text $$;
          SQL

      - name: Restore schema from cache
        if: steps.schema-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p artifacts
          echo "restoring cached schema dump" | tee artifacts/migrations.log
          psql -v ON_ERROR_STOP=1 -f .cache/schema.dump >> artifacts/migrations.log 2>&1

      - name: Apply Supabase migrations
        if: steps.schema-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p artifacts .cache
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--> applying $f" | tee -a artifacts/migrations.log
            psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a artifacts/migrations.log
          done
          # Snapshot the resulting schema + data so subsequent runs with the
          # same migration set can skip the per-file apply loop.
          pg_dump --format=plain --no-owner --no-privileges \
            --schema=public --schema=auth \
            > .cache/schema.dump


      - name: Run security-surface regression suite (Node ${{ matrix.node }})
        id: vitest
        continue-on-error: true
        run: |
          mkdir -p artifacts
          node --version | tee artifacts/node-version.txt
          set +e
          npx --no-install vitest run src/lib/security-surface.test.ts \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=artifacts/junit.xml \
            2>&1 | tee artifacts/vitest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Rerun failed tests once (flaky detection, Node ${{ matrix.node }})
        id: vitest_retry
        if: steps.vitest.outputs.exit_code != '0'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          echo "Initial run failed with exit=${{ steps.vitest.outputs.exit_code }} — retrying once to detect flakes." | tee -a artifacts/vitest.log
          set +e
          # Vitest doesn't have a native "only failed" filter, so rerun the same
          # suite once; merge script reclassifies tests that now pass as flaky.
          npx --no-install vitest run src/lib/security-surface.test.ts \
            --reporter=verbose \
            --reporter=junit \
            --outputFile.junit=artifacts/junit.retry.xml \
            2>&1 | tee artifacts/vitest.retry.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Merge retry results and mark flaky tests
        if: steps.vitest.outputs.exit_code != '0'
        run: |
          if [ -f artifacts/junit.retry.xml ]; then
            node scripts/merge-junit-retries.mjs artifacts/junit.xml artifacts/junit.retry.xml \
              | tee -a artifacts/vitest.log
          else
            echo "No retry JUnit produced; skipping merge." | tee -a artifacts/vitest.log
          fi

      - name: Fail job if tests still failing after retry
        if: steps.vitest.outputs.exit_code != '0' && steps.vitest_retry.outputs.exit_code != '0'
        run: |
          echo "::error::Security regression suite still failing after one retry (Node ${{ matrix.node }})."
          exit 1

      - name: Build HTML test report
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f artifacts/junit.xml ]; then
            node scripts/junit-to-html.mjs artifacts/junit.xml artifacts/report.html
          else
            echo "<h1>No JUnit XML produced</h1>" > artifacts/report.html
          fi


      - name: Write job summary (Node ${{ matrix.node }})
        if: always()
        run: node scripts/junit-to-summary.mjs artifacts/junit.xml "Node ${{ matrix.node }}"


      - name: Collect Postgres logs
        if: failure()
        run: |
          mkdir -p artifacts
          # The postgres service runs as a docker container on the runner.
          container=$(docker ps --filter "ancestor=postgres:15" --format '{{.ID}}' | head -n1)
          if [ -n "$container" ]; then
            docker logs "$container" > artifacts/postgres.log 2>&1 || true
            docker inspect "$container" > artifacts/postgres-inspect.json 2>&1 || true
          else
            echo "no postgres container found" > artifacts/postgres.log
          fi

      - name: Bundle test outputs into single zip
        if: always()
        id: bundle
        run: |
          mkdir -p artifacts
          bundle_name="security-regression-node${{ matrix.node }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}.zip"
          bundle_path="artifacts/${bundle_name}"
          staging="$(mktemp -d)"

          # Write run metadata so every bundle is self-describing.
          cat > "$staging/run-metadata.json" <<META
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "ref_name": "${GITHUB_REF_NAME}",
            "commit_sha": "${GITHUB_SHA}",
            "commit_sha_short": "$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)",
            "event_name": "${GITHUB_EVENT_NAME}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_number": "${GITHUB_RUN_NUMBER}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "job": "${GITHUB_JOB}",
            "runner_os": "${RUNNER_OS}",
            "node_version_matrix": "${{ matrix.node }}",
            "actor": "${GITHUB_ACTOR}",
            "triggering_actor": "${GITHUB_TRIGGERING_ACTOR}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          META

          {
            echo "Security regression bundle"
            echo "=========================="
            echo "Repository:      ${GITHUB_REPOSITORY}"
            echo "Ref:             ${GITHUB_REF_NAME} (${GITHUB_REF})"
            echo "Commit SHA:      ${GITHUB_SHA}"
            echo "Event:           ${GITHUB_EVENT_NAME}"
            echo "Workflow:        ${GITHUB_WORKFLOW}"
            echo "Run ID:          ${GITHUB_RUN_ID}"
            echo "Run number:      ${GITHUB_RUN_NUMBER}"
            echo "Run attempt:     ${GITHUB_RUN_ATTEMPT}"
            echo "Job:             ${GITHUB_JOB}"
            echo "Node (matrix):   ${{ matrix.node }}"
            echo "Runner OS:       ${RUNNER_OS}"
            echo "Actor:           ${GITHUB_ACTOR}"
            echo "Triggering:      ${GITHUB_TRIGGERING_ACTOR}"
            echo "Run URL:         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            echo "Created (UTC):   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$staging/run-metadata.txt"

          # Copy files, capping large log files (head + tail with a marker)
          # and gzip-compressing vitest/migrations/postgres logs with -9 to
          # keep artifact sizes under control.
          MAX_LOG_BYTES=2097152   # 2 MiB cap per log file before compression
          HEAD_BYTES=524288       # 512 KiB from the top
          TAIL_BYTES=1572864      # 1.5 MiB from the bottom

          # Track truncation stats so the manifest can report which logs were
          # capped and by how much.
          truncations_file="$(mktemp)"
          : > "$truncations_file"

          cap_log() {
            local src="$1" dst="$2"
            local size
            size=$(stat -c%s "$src" 2>/dev/null || wc -c <"$src")
            if [ "$size" -le "$MAX_LOG_BYTES" ]; then
              cp "$src" "$dst"
              printf '%s\t%s\t%s\t%s\t%s\n' "$(basename "$dst")" "$size" "$size" 0 0 >> "$truncations_file"
              return
            fi
            local dropped=$((size - HEAD_BYTES - TAIL_BYTES))
            {
              head -c "$HEAD_BYTES" "$src"
              printf '\n\n===== [truncated %s bytes: kept first %s and last %s bytes] =====\n\n' \
                "$dropped" "$HEAD_BYTES" "$TAIL_BYTES"
              tail -c "$TAIL_BYTES" "$src"
            } > "$dst"
            local kept
            kept=$(stat -c%s "$dst" 2>/dev/null || wc -c <"$dst")
            printf '%s\t%s\t%s\t%s\t%s\n' "$(basename "$dst")" "$size" "$kept" "$dropped" 1 >> "$truncations_file"
          }

          # Text log files: cap + gzip -9. Record gzipped size next to the
          # truncation ledger so run-metadata can report original vs gzipped.
          gzipped_sizes_file="$(mktemp)"
          : > "$gzipped_sizes_file"
          for f in vitest.log vitest.retry.log migrations.log postgres.log; do
            src="artifacts/$f"
            [ -f "$src" ] || continue
            cap_log "$src" "$staging/$f"
            gzip -9 -f "$staging/$f"   # produces $staging/$f.gz
            gz_size=$(stat -c%s "$staging/$f.gz" 2>/dev/null || wc -c <"$staging/$f.gz")
            printf '%s\t%s\n' "$f" "$gz_size" >> "$gzipped_sizes_file"
          done

          # Structured / small files: copy as-is (report.html and junit.xml
          # are consumed by tooling that expects them unmodified).
          for f in junit.xml junit.retry.xml report.html node-version.txt postgres-inspect.json; do
            [ -f "artifacts/$f" ] && cp "artifacts/$f" "$staging/" || true
          done

          # Patch run-metadata.{json,txt} with per-log original/kept/gzipped sizes.
          TRUNCATIONS_FILE="$truncations_file" \
          GZIPPED_SIZES_FILE="$gzipped_sizes_file" \
          STAGING="$staging" \
          python3 - <<'PY'
          import json, os
          staging = os.environ["STAGING"]
          tpath   = os.environ["TRUNCATIONS_FILE"]
          gpath   = os.environ["GZIPPED_SIZES_FILE"]

          gz = {}
          if os.path.isfile(gpath):
              with open(gpath) as fh:
                  for line in fh:
                      parts = line.rstrip("\n").split("\t")
                      if len(parts) == 2:
                          gz[parts[0]] = int(parts[1])

          logs = []
          if os.path.isfile(tpath):
              with open(tpath) as fh:
                  for line in fh:
                      parts = line.rstrip("\n").split("\t")
                      if len(parts) != 5: continue
                      name, original, kept, dropped, flag = parts
                      original_i = int(original); kept_i = int(kept); gz_i = gz.get(name, 0)
                      ratio = (gz_i / kept_i) if kept_i > 0 else 0.0
                      logs.append({
                          "name": name,
                          "truncated": flag == "1",
                          "original_bytes":     original_i,
                          "kept_bytes":         kept_i,
                          "dropped_bytes":      int(dropped),
                          "gzipped_bytes":      gz_i,
                          "gzip_ratio_of_kept": round(ratio, 4),
                      })

          # Patch JSON metadata.
          jpath = os.path.join(staging, "run-metadata.json")
          with open(jpath) as fh:
              meta = json.load(fh)
          meta["capped_logs"] = logs
          meta["capped_logs_totals"] = {
              "count":                len(logs),
              "truncated_count":      sum(1 for l in logs if l["truncated"]),
              "total_original_bytes": sum(l["original_bytes"] for l in logs),
              "total_kept_bytes":     sum(l["kept_bytes"]     for l in logs),
              "total_gzipped_bytes":  sum(l["gzipped_bytes"]  for l in logs),
              "total_dropped_bytes":  sum(l["dropped_bytes"]  for l in logs),
          }
          with open(jpath, "w") as fh:
              json.dump(meta, fh, indent=2)

          # Append plain-text section.
          tpath_txt = os.path.join(staging, "run-metadata.txt")
          with open(tpath_txt, "a") as fh:
              fh.write("\nCapped log sizes (original / kept / gzipped, bytes)\n")
              fh.write("---------------------------------------------------\n")
              if not logs:
                  fh.write("(no logs captured)\n")
              for l in logs:
                  flag = "TRUNC" if l["truncated"] else "full "
                  fh.write(
                      f"  {flag}  {l['name']:<20} "
                      f"original={l['original_bytes']:>10}  "
                      f"kept={l['kept_bytes']:>10}  "
                      f"gzipped={l['gzipped_bytes']:>10}  "
                      f"dropped={l['dropped_bytes']:>10}\n"
                  )
          PY




          # Build manifest.json listing every file in the staging dir with
          # size (bytes), sha256, and modification timestamp (UTC ISO-8601).
          # Also includes a truncation summary describing which logs were
          # capped and how many bytes were dropped.
          TRUNCATIONS_FILE="$truncations_file" \
          MAX_LOG_BYTES="$MAX_LOG_BYTES" \
          HEAD_BYTES="$HEAD_BYTES" \
          TAIL_BYTES="$TAIL_BYTES" \
          python3 - "$staging" > "$staging/manifest.json" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          root = sys.argv[1]
          entries = []
          for name in sorted(os.listdir(root)):
              path = os.path.join(root, name)
              if not os.path.isfile(path) or name == "manifest.json":
                  continue
              st = os.stat(path)
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(65536), b""):
                      h.update(chunk)
              entries.append({
                  "name": name,
                  "size_bytes": st.st_size,
                  "sha256": h.hexdigest(),
                  "modified_utc": datetime.fromtimestamp(st.st_mtime, tz=timezone.utc)
                      .strftime("%Y-%m-%dT%H:%M:%SZ"),
              })

          # Parse truncation ledger written by cap_log:
          #   <name>\t<original>\t<kept>\t<dropped>\t<was_truncated>
          truncations = []
          tpath = os.environ.get("TRUNCATIONS_FILE")
          if tpath and os.path.isfile(tpath):
              with open(tpath) as fh:
                  for line in fh:
                      parts = line.rstrip("\n").split("\t")
                      if len(parts) != 5:
                          continue
                      name, original, kept, dropped, flag = parts
                      original_i = int(original); kept_i = int(kept); dropped_i = int(dropped)
                      pct = (dropped_i / original_i * 100.0) if original_i > 0 else 0.0
                      truncations.append({
                          "name": name,
                          "truncated": flag == "1",
                          "original_bytes": original_i,
                          "kept_bytes": kept_i,
                          "dropped_bytes": dropped_i,
                          "dropped_pct": round(pct, 2),
                      })
          truncated_only = [t for t in truncations if t["truncated"]]

          json.dump({
              "generated_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "file_count": len(entries),
              "total_size_bytes": sum(e["size_bytes"] for e in entries),
              "files": entries,
              "truncation_summary": {
                  "policy": {
                      "max_log_bytes": int(os.environ.get("MAX_LOG_BYTES", 0)),
                      "head_bytes":    int(os.environ.get("HEAD_BYTES", 0)),
                      "tail_bytes":    int(os.environ.get("TAIL_BYTES", 0)),
                      "note": "Logs larger than max_log_bytes are capped to head_bytes + tail_bytes with a marker between; then gzip -9 compressed.",
                  },
                  "considered_count": len(truncations),
                  "truncated_count":  len(truncated_only),
                  "total_dropped_bytes": sum(t["dropped_bytes"] for t in truncations),
                  "logs": truncations,
              },
          }, sys.stdout, indent=2)
          PY


          ( cd "$staging" && zip -qr "$GITHUB_WORKSPACE/$bundle_path" . )
          echo "bundle_name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "bundle_path=$bundle_path" >> "$GITHUB_OUTPUT"
          ls -la "$bundle_path"

      - name: Enforce bundle size budget
        if: always() && steps.bundle.outputs.bundle_path != ''
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle_path }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          # Max allowed size of the final (zip/gzipped) bundle, in bytes.
          # Override at workflow-dispatch or repo-var level by setting
          # SECURITY_REGRESSION_BUNDLE_MAX_BYTES. Default: 25 MiB.
          BUNDLE_MAX_BYTES: ${{ vars.SECURITY_REGRESSION_BUNDLE_MAX_BYTES || 26214400 }}
        run: |
          set -euo pipefail
          size=$(stat -c%s "$BUNDLE_PATH" 2>/dev/null || wc -c <"$BUNDLE_PATH")
          max="$BUNDLE_MAX_BYTES"
          hsize=$(numfmt --to=iec --suffix=B "$size" 2>/dev/null || echo "${size}B")
          hmax=$(numfmt  --to=iec --suffix=B "$max"  2>/dev/null || echo "${max}B")
          {
            echo "### 📏 Bundle size guard"
            echo ""
            echo "- Bundle: \`$BUNDLE_NAME\`"
            echo "- Size:   **$hsize** ($size bytes)"
            echo "- Budget: $hmax ($max bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$max" ]; then
            over=$((size - max))
            hover=$(numfmt --to=iec --suffix=B "$over" 2>/dev/null || echo "${over}B")
            echo "- Status: ❌ **exceeded budget by $hover**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Bundle size budget exceeded::$BUNDLE_NAME is $hsize (limit $hmax, over by $hover). Inspect manifest.json truncation_summary and tighten log caps or drop artifacts."
            exit 1
          fi
          echo "- Status: ✅ within budget" >> "$GITHUB_STEP_SUMMARY"





      - name: Upload bundled test artifacts
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.bundle_path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Append bundle download link to job summary
        if: always() && steps.upload-report.outputs.artifact-url != ''
        env:
          BUNDLE_URL: ${{ steps.upload-report.outputs.artifact-url }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
        run: |
          {
            echo ""
            echo "### 📦 Bundle artifact (Node ${{ matrix.node }})"
            echo ""
            echo "[⬇️ Download zip bundle (\`${BUNDLE_NAME}\`)](${BUNDLE_URL})"
            echo ""
            echo "_Includes JUnit XML, HTML report, vitest logs, migrations log, Postgres logs, run-metadata.{json,txt}, and manifest.json._"
          } >> "$GITHUB_STEP_SUMMARY"





      - name: Upload HTML report (standalone, for direct Slack link)
        id: upload-html-report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-html-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          artifacts_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          report_url="${{ steps.upload-report.outputs.artifact-url }}"
          report_url="${report_url:-$artifacts_url}"
          html_url="${{ steps.upload-html-report.outputs.artifact-url }}"
          html_url="${html_url:-$artifacts_url}"
          payload=$(cat <<JSON
          {
            "text": ":rotating_light: Security regression failed on \`${GITHUB_REF_NAME}\` (${GITHUB_REPOSITORY}) — Node ${{ matrix.node }}",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "Security regression failed" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Repo:*\n${GITHUB_REPOSITORY}" },
                  { "type": "mrkdwn", "text": "*Ref:*\n\`${GITHUB_REF_NAME}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${GITHUB_SHA:0:7}\`" },
                  { "type": "mrkdwn", "text": "*Node:*\n${{ matrix.node }}" },
                  { "type": "mrkdwn", "text": "*Event:*\n${GITHUB_EVENT_NAME}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  { "type": "button", "text": { "type": "plain_text", "text": "View run" }, "url": "${run_url}" },
                  { "type": "button", "style": "primary", "text": { "type": "plain_text", "text": "HTML report (Node ${{ matrix.node }})" }, "url": "${html_url}" },
                  { "type": "button", "text": { "type": "plain_text", "text": "JUnit + logs bundle" }, "url": "${report_url}" },
                  { "type": "button", "text": { "type": "plain_text", "text": "All artifacts" }, "url": "${artifacts_url}" }
                ]
              }
            ]
          }
          JSON
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"




