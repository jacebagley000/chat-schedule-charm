name: Security regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to run the suite against"
        required: false
        default: ""


concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  security-surface:
    name: SQL security surface + Vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}


      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Supabase-compatible roles
        # Migrations reference the standard Supabase roles (anon,
        # authenticated, service_role) and the auth schema. Create minimal
        # stand-ins so the schema applies cleanly against vanilla Postgres.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb,
            email_confirmed_at timestamptz
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT 'authenticated'::text $$;
          SQL

      - name: Apply Supabase migrations
        run: |
          set -e
          mkdir -p artifacts
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--> applying $f" | tee -a artifacts/migrations.log
            psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a artifacts/migrations.log
          done

      - name: Run security-surface regression suite
        id: vitest
        run: |
          mkdir -p artifacts
          set -o pipefail
          bunx vitest run src/lib/security-surface.test.ts --reporter=verbose 2>&1 | tee artifacts/vitest.log

      - name: Collect Postgres logs
        if: failure()
        run: |
          mkdir -p artifacts
          # The postgres service runs as a docker container on the runner.
          container=$(docker ps --filter "ancestor=postgres:15" --format '{{.ID}}' | head -n1)
          if [ -n "$container" ]; then
            docker logs "$container" > artifacts/postgres.log 2>&1 || true
            docker inspect "$container" > artifacts/postgres-inspect.json 2>&1 || true
          else
            echo "no postgres container found" > artifacts/postgres.log
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

