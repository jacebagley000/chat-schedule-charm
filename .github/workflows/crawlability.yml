name: Crawlability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployed URL to crawl-test (defaults to the STAGING_URL / PREVIEW_URL repo variable)"
        required: false
        type: string

concurrency:
  group: crawlability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawlability:
    name: robots.txt / sitemap.xml contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check noindex vs robots/sitemap allowlist
        id: noindex_check
        run: node scripts/check-noindex.mjs --json artifacts/noindex/noindex-report.json

      - name: Upload noindex JSON report
        id: noindex_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noindex-report
          path: artifacts/noindex/
          if-no-files-found: warn

      - name: Link noindex report in job summary
        if: always() && steps.noindex_check.outcome == 'failure'
        run: |
          {
            echo "### 📄 noindex checker report"
            echo ""
            if [ -n "${{ steps.noindex_report.outputs.artifact-url }}" ]; then
              echo "The noindex/robots allowlist check failed — download the full report: [**noindex-report**](${{ steps.noindex_report.outputs.artifact-url }}) (\`noindex-report.json\`)."
            else
              echo "The noindex/robots allowlist check failed — see the \`noindex-report\` artifact on this run for \`noindex-report.json\`."
            fi
            echo ""
            echo "Artifacts for this run: [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"




      - name: Start dev server
        run: |
          mkdir -p artifacts
          (bun run dev > artifacts/server.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dev server did not start within 90s"
          tail -n 100 artifacts/server.log
          exit 1

      - name: Check robots.txt / sitemap.xml crawlability contract
        run: bash scripts/check-crawlability.sh http://localhost:8080

      - name: Generate route index report
        if: always()
        run: node scripts/route-index-report.mjs --out artifacts/route-index --base-url http://localhost:8080

      - name: Upload route index report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-index-report
          path: artifacts/route-index
          if-no-files-found: warn

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawlability-server-log
          path: artifacts/server.log
          if-no-files-found: ignore

  deployed:
    name: crawlability against deployed site
    runs-on: ubuntu-latest
    # Only run when a target URL is configured; skips cleanly otherwise.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.deployment_url }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        run: |
          url="${INPUT_URL:-${STAGING_URL:-$PREVIEW_URL}}"
          url="${url%/}"
          if [ -z "$url" ]; then
            echo "::notice::No STAGING_URL/PREVIEW_URL repo variable and no input URL - skipping deployed crawlability check."
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            echo "Target: $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deployment to respond
        if: steps.target.outputs.url != ''
        run: |
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.target.outputs.url }}/robots.txt" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "deployment reachable after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}: /robots.txt -> $code"
            sleep 10
          done
          echo "::error::${{ steps.target.outputs.url }}/robots.txt never returned 200"
          exit 1

      - name: Check robots.txt / sitemap.xml crawlability contract
        if: steps.target.outputs.url != ''
        run: bash scripts/check-crawlability.sh "${{ steps.target.outputs.url }}"

      - name: Generate route index report (deployed)
        if: always() && steps.target.outputs.url != ''
        run: node scripts/route-index-report.mjs --out artifacts/route-index-deployed --base-url "${{ steps.target.outputs.url }}"

      - name: Upload route index report (deployed)
        if: always() && steps.target.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: route-index-report-deployed
          path: artifacts/route-index-deployed
          if-no-files-found: warn
